# **只许显式 $skill 调用，禁止模型按 description 隐式选择。**
#
# 出过真事故：一条 agent 之间的消息里**提到**了这个命令，技能就被选中，
# 直接去执行真实绑定（那次是审批门挡住的）。技能描述里写着"讨论和引用
# 不得触发"，但那是给模型看的约定 —— 宿主的技能选择这一层不受它约束。
#
# 这一层跟脚本里的一次性凭证门禁**同时存在**，缺一不可：
#   这里挡「误选」—— 模型不该自作主张挑中一个有副作用的技能；
#   凭证挡「误执行」—— 就算被选中了，没有人亲自输入过命令就拿不到票。
# 只有一层的话：单靠这里，显式调用路径仍可被转述文本触发；
# 单靠凭证，每次误选都要靠门禁兜底，而门禁是最后一道，不该当第一道用。
policy:
  allow_implicit_invocation: false
